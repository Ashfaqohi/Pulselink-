server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location = /health { proxy_pass http://backend:8000; }
  location = /ready { proxy_pass http://backend:8000; }
  location = /metrics { proxy_pass http://backend:8000; }
  location / { try_files $uri $uri/ @backend_or_spa; }
  location @backend_or_spa {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
}
