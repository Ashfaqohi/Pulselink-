groups:
  - name: pulselink-user-impact
    rules:
      - alert: RedirectFailureRateHigh
        expr: |
          (
            sum(rate(redirect_requests_total{outcome="failure"}[5m]))
            /
            clamp_min(sum(rate(redirect_requests_total[5m])), 0.000001)
          ) > 0.05
          and sum(increase(redirect_requests_total[5m])) >= 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Redirect failures are affecting users
          description: More than 5% of observed redirects failed for at least five minutes with meaningful traffic.

      - alert: RedirectLatencyHigh
        expr: redirect_request_duration_seconds{quantile="0.95"} > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redirect latency is affecting users
          description: The observed redirect p95 has exceeded 300ms for five minutes.

      - alert: RedirectTrafficMissing
        expr: absent_over_time(redirect_requests_total[10m])
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No redirect telemetry is arriving
          description: The service may be unavailable or telemetry may be broken; validate with the synthetic check.
